<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Türkçe İstanbul – Admin</title>
<link rel="stylesheet" href="style.css">
<style>
 body{padding-block:24px}main.adm{max-width:980px;margin:0 auto;padding:0 14px}
 table.adm{width:100%;border-collapse:collapse;font-size:.92rem}
 .adm th,.adm td{padding:8px 10px;border-bottom:2px solid var(--line);text-align:start;white-space:nowrap}
 .adm th{color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.5px}
 .wrap{overflow-x:auto}.adm .btn{display:inline-block;width:auto;margin:0 4px 0 0;padding:6px 10px;font-size:.72rem;box-shadow:0 3px 0 var(--gd)}
 .adm .btn.red{margin-block-start:0;box-shadow:0 3px 0 var(--rd)}.adm .btn.alt{box-shadow:0 3px 0 var(--line)}
 .sum{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.sum div{padding:10px 16px;border:2px solid var(--line);border-radius:14px}.sum b{display:block;font-size:1.4rem}
 #msg{min-height:1.4em;font-weight:800}.ok{color:var(--g)}.err{color:var(--r)}code{padding:2px 6px;border-radius:6px;background:var(--line)}
</style>
</head>
<body>
<main class="adm">
 <h2>🛠 Admin</h2>
 <p class="mut"><a href="./">← Back to the app</a></p>
 <div id="msg" role="status"></div>
 <div id="root"><p class="mut">Loading…</p></div>
</main>
<script src="js/admin.js"></script>
</body>
</html>
